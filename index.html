<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F5" />
    <meta name="description" content="A life dashboard: habits, tasks, calendar, books, jobs, money, and mail." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Tally</title>
    <script>
      // Set the theme before first paint so there's no light flash in dark mode.
      (function () {
        try {
          var p = localStorage.getItem('tally-theme') || 'system';
          var dark =
            p === 'dark' ||
            (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
