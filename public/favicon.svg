<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#ECEDE7"/>
  <!-- Two spot inks on a grid of days; where both land, they overprint. -->
  <g>
    <rect x="5"  y="5"  width="7" height="7" fill="#1F4FD8"/>
    <rect x="13" y="5"  width="7" height="7" fill="#1F4FD8"/>
    <rect x="21" y="5"  width="7" height="7" fill="#1F4FD8" opacity="0.25"/>
    <rect x="5"  y="13" width="7" height="7" fill="#1F4FD8"/>
    <rect x="13" y="13" width="7" height="7" fill="#6B3FC4"/>
    <rect x="21" y="13" width="7" height="7" fill="#1F4FD8"/>
    <rect x="5"  y="21" width="7" height="7" fill="#1F4FD8" opacity="0.25"/>
    <rect x="13" y="21" width="7" height="7" fill="#1F4FD8"/>
    <rect x="21" y="21" width="7" height="7" fill="#FF4FA3"/>
  </g>
</svg>
